[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
  "nanobind>=2",
  "scikit-build-core[hatchling]>=1.0.1",
]

[project]
name = "rapids-singlecell"
description = "running single cell analysis on Nvidia GPUs"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
maintainers = [ { name = "Severin Dicks", email = "severin.dicks@scverse.org" } ]
authors = [ { name = "Severin Dicks" } ]
requires-python = ">=3.12,<3.15"
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dynamic = [ "version" ]
scripts.rapids-singlecell-install-skills = "rapids_singlecell_skills.install:main"
scripts.rapids-singlecell-check-kernel = "rapids_singlecell_skills.kernel:main"
# lets zarr find `rapids_singlecell_zarr.KvikioCodecPipeline` in every process
entry-points."zarr.codec_pipeline".kvikio = "rapids_singlecell_zarr:KvikioCodecPipeline"

dependencies = [
    "anndata>=0.12.14",
    "scanpy>=1.10.0",
    "scverse-misc[settings]>=0.1.3",
    "numpy>=1.26",
    "scipy!=1.17.0,>=1.12",
    "pandas",
    "natsort",
    "scikit-misc>=0.1.3",
    "scikit-learn",
    "tqdm",
    "statsmodels>=0.12.0",
    "scikit-image",
    "docrep",
    # the codec pipeline zarr loads through the entry point builds on zarr ≥ 3.3
    "zarr>=3.3",
]

[project.optional-dependencies]
rapids-cu13 = [
    "cupy-cuda13x[ctk]>=14",
    "cudf-cu13>=25.12",
    "cuml-cu13>=25.12",
    "cugraph-cu13>=25.12",
    "cuvs-cu13>=25.12",
]
# reading zarr straight into GPU memory (`rapids_singlecell.io`)
io-cu13 = [ "kvikio-cu13>=26.4", "nvidia-nvcomp-cu13>=5.2" ]
io-cu12 = [ "kvikio-cu12>=26.4", "nvidia-nvcomp-cu12>=5.2" ]
rapids-cu12 = [
    "cupy-cuda12x[ctk]>=14",
    "cudf-cu12>=25.12",
    "cuml-cu12>=25.12",
    "cugraph-cu12>=25.12",
    "cuvs-cu12>=25.12",
]

[dependency-groups]
docs = [
    "sphinx>=4.5.0",
    "sphinx-copybutton",
    "nbsphinx>=0.8.12",
    "myst-nb",
    "sphinx-design",
    "sphinx-tabs",
    "sphinxext-opengraph",
    "sphinxcontrib.bibtex",
    "scanpydoc[typehints,theme]>=0.9.4",
    "scverse-misc[sphinx]>=0.1.3",
    "dask",
    "pytest",
    "spatialdata>=0.7.2",
]
test-minimal = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-rerunfailures",
    "anyio",
    "pooch",
    "profimp",
    "scanpy>=1.10.0",
    "bbknn",
    "decoupler",
    "fast-array-utils",
    # beta without a numpy cap: uv backtracks into it and pairs it with numpy 2.5,
    # which numba-cuda (still imported by cudf) can't import against
    "numba!=0.63.0b1",
]
optional-dependencies.rapids-cu13 = [
  "cudf-cu13>=25.12",
  "cugraph-cu13>=25.12",
  "cuml-cu13>=25.12",
  "cupy-cuda13x[ctk]>=14",
  "cuvs-cu13>=25.12",
]
urls.Documentation = "https://rapids-singlecell.scverse.org/"
urls.Homepage = "https://github.com/scverse/rapids-singlecell"
urls.Source = "https://github.com/scverse/rapids-singlecell"
scripts.rapids-singlecell-check-kernel = "rapids_singlecell_skills.kernel:main"
scripts.rapids-singlecell-install-skills = "rapids_singlecell_skills.install:main"

[dependency-groups]
dev = [
  "hatch-vcs",
  "prek",
]
test = [
  "igraph",
  "spatialdata>=0.7.2",
  { include-group = "test-minimal" },
]
docs = [
  "dask",
  "nbsphinx>=0.8.12",
  "pytest",
  "scverse-doc[full]>=0.3",
  "scverse-misc[sphinx]>=0.1.3",
  "spatialdata>=0.7.2",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinxcontrib-bibtex",
]
test-minimal = [
  "anyio",
  "bbknn",
  "decoupler",
  "fast-array-utils",
  # beta without a numpy cap: uv backtracks into it and pairs it with numpy 2.5,
  # which numba-cuda (still imported by cudf) can't import against
  "numba!=0.63.0b1",
  "pooch",
  "profimp",
  "pytest",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-timeout",
  "scanpy>=1.10",
]
typecheck = [
  "cupy-stubs",
  "mypy",
  "pandas-stubs",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.hatch.build.hooks.vcs]
version-file = "src/rapids_singlecell/_version.py"

[tool.hatch.build.targets.wheel]
packages = [
    "src/rapids_singlecell",
    "src/rapids_singlecell_skills",
    "src/rapids_singlecell_zarr",
    "src/testing",
]
exclude = [ "**/*.cu", "**/*.cuh", "**/*.h" ]

[tool.hatch.build.targets.wheel.hooks.scikit-build]
[tool.hatch]
version.source = "vcs"
version.raw-options.local_scheme = "node-and-date"
version.raw-options.version_scheme = "guess-next-dev"
build.hooks.vcs.version-file = "src/rapids_singlecell/_version.py"
build.targets.wheel.packages = [ "src/rapids_singlecell", "src/rapids_singlecell_skills", "src/testing" ]
build.targets.wheel.exclude = [ "**/*.cu", "**/*.cuh", "**/*.h" ]
build.targets.wheel.hooks.scikit-build = {}

[tool.scikit-build]
build-dir = "build"
cmake.build-type = "Release"
# Default: use native arch for source builds (auto-detect user's GPU)
# CI overrides via SKBUILD_CMAKE_DEFINE_CMAKE_CUDA_ARCHITECTURES env var
cmake.define.CMAKE_CUDA_ARCHITECTURES = "native"
cmake.version = ">=3.24"
ninja.version = ">=1.10"
# Use limited ABI wheels (one wheel for all Python minor versions on one platform)
wheel.py-api = "cp312"

[tool.cibuildwheel]
# Use abi3audit to catch issues with Limited API wheels
# Exclude CUDA runtime libs provided by dependency wheels.
# Keep in sync with CIBW_REPAIR_WHEEL_COMMAND in publish.yml.
linux.repair-wheel-command = [
  """\
  auditwheel repair --exclude 'libcublas.so.*' --exclude 'libcublasLt.so.*' --exclude 'libcudart.so.*' --exclude \
  'libcusolver.so.*' --exclude 'libcusparse.so.*' --exclude 'libnvJitLink.so.*' -w {dest_dir} {wheel}\
  """,
  "pipx run abi3audit --strict --report {wheel}",
]
macos.repair-wheel-command = [
  "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
  "pipx run abi3audit --strict --report {wheel}",
]
windows.repair-wheel-command = [
  "copy {wheel} {dest_dir}",
  "pipx run abi3audit --strict --report {wheel}",
]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]
# tutorials live in the rapids-singlecell-tutorials submodule (docs/notebooks are symlinks)
extend-exclude = [ "docs/notebooks", "notebooks" ]
format.docstring-code-format = true
lint.select = [
  "B",       # flake8-bugbear
  "BLE",     # flake8-blind-except
  "C4",      # flake8-comprehensions
  "D",       # pydocstyle
  "E",       # Error detected by Pycodestyle
  "F",       # Errors detected by Pyflakes
  "FBT",     # No boolean positional parameters
  "I",       # isort
  "ICN",     # Follow import conventions
  "PLR0917", # Ban APIs with too many positional parameters
  "PTH",     # Pathlib instead of os.path
  "RUF100",  # Report unused noqa directives
  "TC",      # manage type checking blocks
  "TID",     # flake8-tidy-imports
  "TID251",  # Banned imports
  "UP",      # pyupgrade
  "W",       # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
  "F403", # allow star imports
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D", "FBT" ]
lint.isort.known-first-party = [ "rapids_singlecell" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pydocstyle.convention = "numpy"

[tool.codespell]
ignore-words-list = "nd,indext,coo,alo,clen,fo,ot,numer"
skip = "*.ipynb,*.csv"

[tool.mypy]
mypy_path = "src"
files = [ "src" ]
explicit_package_bases = true
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = [ "ignore-without-code" ]
warn_unused_configs = true

# RAPIDS and friends ship without type information
[[tool.mypy.overrides]]
module = [ "cudf.*", "cuml.*", "cuvs.*", "numba.*", "pylibraft.*" ]
ignore_missing_imports = true

# scanpy has inline annotations but no py.typed marker
[[tool.mypy.overrides]]
module = [ "scanpy", "scanpy.*" ]
follow_untyped_imports = true

# nanobind stubs are generated at build time and absent with RSC_BUILD_EXTENSIONS=OFF
# (when present, their overloads trip `overload-cannot-match`: not ours to fix)
[[tool.mypy.overrides]]
module = [ "rapids_singlecell._cuda.*" ]
ignore_missing_imports = true
ignore_errors = true

# Ratchet: modules that do not type check yet. Fix one, then delete it here.
# Most failures are CuPy APIs that cupy-stubs does not cover yet.
