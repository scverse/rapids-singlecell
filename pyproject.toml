[tool.pytest]
ini_options.addopts = [
  "--import-mode=importlib",
  "--strict-markers",
  "--timeout=60",
]
ini_options.markers = [
  "array_api: unused, registered because anndata.tests.helpers uses it",
  "gpu: unused, registered because anndata.tests.helpers uses it",
]

[tool.coverage]
run.source_pkgs = [ "rapids_singlecell" ]
run.omit = [ "src/testing/*", "tests/*" ]
run.data_file = "test-data/coverage"
paths.source = [ "./src", "**/site-packages" ]
report.exclude_also = [
  "if TYPE_CHECKING:",
]
xml.output = "test-data/coverage.xml"

[tool.cruft]
# project-specific files the scverse template must not touch on `cruft update`
skip = [
  ".git",
  "src",
  "tests",
  "docs",
  "README.md",
  "CHANGELOG.md",
  ".github/ISSUE_TEMPLATE",
  # GPU CI: test-gpu.yml and publish.yml replace the template's CPU workflows
  ".github/workflows/build.yaml",
  ".github/workflows/release.yaml",
  ".github/workflows/test.yaml",
]
