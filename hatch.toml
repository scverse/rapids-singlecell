[envs.default]
installer = "uv"
features = [ "dev" ]

[envs.hatch-test]
default-args = [  ]
features = [ "test" ]

# Select CUDA feature per matrix
overrides.matrix.cuda.features = [
    { if = [ "12" ], value = "rapids-cu12" },
    { if = [ "13" ], value = "rapids-cu13" },
]

# Python per deps
overrides.matrix.deps.python = [
    { if = [ "stable" ], value = "3.12" },
    { if = [ "dev" ], value = "3.14" },
    { if = [ "rapids_prerelease" ], value = "3.14" },
]

# `explicit` honours only the `>=0a0` markers below; `dev` needs none (git refs)
overrides.matrix.deps.env-vars = [
    { if = [
        "rapids_prerelease",
    ], key = "UV_PRERELEASE", value = "explicit" },
    { if = [
        "rapids_prerelease",
    ], key = "UV_EXTRA_INDEX_URL", value = "https://pypi.anaconda.org/rapidsai-wheels-nightly/simple" },
]

# Dev: use upstream heads for anndata/scanpy
overrides.matrix.deps.extra-dependencies = [
    { if = [
        "dev",
    ], value = "anndata @ git+https://github.com/scverse/anndata.git" },
    { if = [
        "dev",
    ], value = "scanpy @ git+https://github.com/scverse/scanpy.git" },
    # numpy 2.5 dropped `np.row_stack`, which numba-cuda calls (NVIDIA/numba-cuda#907)
    { if = [
        "stable",
        "dev",
        "rapids_prerelease",
    ], value = "numpy<2.5" },
    # newer numba/numba-cuda pairs are mutually incompatible; pin the known-good one
    { if = [
        "stable",
        "dev",
        "rapids_prerelease",
    ], value = "numba>=0.64,<0.65" },
    { if = [
        "dev",
        "rapids_prerelease",
    ], value = "numba-cuda<0.30" },
]
# RAPIDS pins depend on both `deps` and `cuda`, so they key off the env name
overrides.name."(stable|dev)-12$".extra-dependencies = [
    "cuml-cu12<26.12",
    "cudf-cu12<26.12",
    "cugraph-cu12<26.12",
    "cuvs-cu12<26.12",
]
overrides.name."(stable|dev)-13$".extra-dependencies = [
    "cuml-cu13<26.12",
    "cudf-cu13<26.12",
    "cugraph-cu13<26.12",
    "cuvs-cu13<26.12",
]

# uv honours `>=0a0` only on direct requirements, so list the whole RAPIDS closure
overrides.name."rapids_prerelease-12$".extra-dependencies = [
    "cudf-cu12>=0a0",
    "cugraph-cu12>=0a0",
    "cuml-cu12>=0a0",
    "cuvs-cu12>=0a0",
    "dask-cudf-cu12>=0a0",
    "distributed-ucxx-cu12>=0a0",
    "libcudf-cu12>=0a0",
    "libcugraph-cu12>=0a0",
    "libcuml-cu12>=0a0",
    "libcuvs-cu12>=0a0",
    "libkvikio-cu12>=0a0",
    "libnvforest-cu12>=0a0",
    "libraft-cu12>=0a0",
    "librmm-cu12>=0a0",
    "libucxx-cu12>=0a0",
    "nvforest-cu12>=0a0",
    "pylibcudf-cu12>=0a0",
    "pylibcugraph-cu12>=0a0",
    "pylibraft-cu12>=0a0",
    "raft-dask-cu12>=0a0",
    "rmm-cu12>=0a0",
    "ucxx-cu12>=0a0",
    "dask-cuda>=0a0",
    "rapids-dask-dependency>=0a0",
    "anndata>=0a0",
    "scanpy>=0a0",
]
overrides.name."rapids_prerelease-13$".extra-dependencies = [
    "cudf-cu13>=0a0",
    "cugraph-cu13>=0a0",
    "cuml-cu13>=0a0",
    "cuvs-cu13>=0a0",
    "dask-cudf-cu13>=0a0",
    "distributed-ucxx-cu13>=0a0",
    "libcudf-cu13>=0a0",
    "libcugraph-cu13>=0a0",
    "libcuml-cu13>=0a0",
    "libcuvs-cu13>=0a0",
    "libkvikio-cu13>=0a0",
    "libnvforest-cu13>=0a0",
    "libraft-cu13>=0a0",
    "librmm-cu13>=0a0",
    "libucxx-cu13>=0a0",
    "nvforest-cu13>=0a0",
    "pylibcudf-cu13>=0a0",
    "pylibcugraph-cu13>=0a0",
    "pylibraft-cu13>=0a0",
    "raft-dask-cu13>=0a0",
    "rmm-cu13>=0a0",
    "ucxx-cu13>=0a0",
    "dask-cuda>=0a0",
    "rapids-dask-dependency>=0a0",
    "anndata>=0a0",
    "scanpy>=0a0",
]

## For prerelease we rely on UV_PRERELEASE + nightly index; features select cu12/cu13

[envs.docs]
features = [ "doc" ]
scripts.build = "sphinx-build -W --keep-going -b html docs docs/_build/html {args}"
scripts.clean = "git clean -fXd docs"

[envs.default.pip]
extra_index_urls = [
    "https://pypi.nvidia.com",
]


[[envs.hatch-test.matrix]]
deps = [ "stable", "dev", "rapids_prerelease" ]
cuda = [ "12", "13" ]
