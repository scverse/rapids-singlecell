fail_fast: false
default_language_version:
  python: python3
default_stages:
  - pre-commit
  - pre-push
minimum_pre_commit_version: 2.16.0
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.2
    hooks:
      - id: biome-format
        exclude: ^\.cruft\.json$ # inconsistent indentation with cruft - file never to be modified manually.
        groups: [format]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.30.3
    hooks:
      - id: pyproject-fmt
        groups: [format]
  # pyproject.toml is formatted by pyproject-fmt, the remaining TOML files by tombi
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.9.6
    hooks:
      - id: tombi-format
        # our files don't need SchemaStore schemas, so skip fetching them
        args: [--offline]
        exclude: ^pyproject\.toml$
        groups: [format]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        groups: [format]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        args: [--style=file, -i]
        types_or: [c, c++, cuda]
        groups: [format]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: hatch check types
        language: system
        types: [python]
        files: ^src/
        require_serial: true
        pass_filenames: false
        groups: [typecheck]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
        groups: [format]
      - id: mixed-line-ending
        exclude: ^\.cruft\.json$  # inconsistent file endings on windows - file never to be modified manually.
        args: [--fix=lf]
        groups: [format]
      - id: trailing-whitespace
        groups: [format]
      - id: check-case-conflict
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch
        args: [--branch=main]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        exclude: ^docs/references\.bib$

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
