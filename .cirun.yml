runners:
  # Primary: A10G. ~3-4x faster than the T4 (Ampere, tensor cores, ~600 GB/s).
  - name: aws-gpu-runner-g5
    cloud: aws
    instance_type: g5.xlarge
    machine_image: ami-0f07c7f3983ea4561
    region: eu-west-1
    preemptible:
      - true
      - false
    labels:
      - cirun-aws-gpu
  # Fallback: T4. Cheapest; cirun picks this when g5 spot is dry.
  - name: aws-gpu-runner-g4dn
    cloud: aws
    instance_type: g4dn.xlarge
    machine_image: ami-0f07c7f3983ea4561
    region: eu-west-1
    preemptible:
      - true
      - false
    labels:
      - cirun-aws-gpu
